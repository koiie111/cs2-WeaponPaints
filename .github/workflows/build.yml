name: Build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
        with:
          # Images are served separately and are not part of either release archive.
          sparse-checkout: |
            /*
            !/website/img/
          sparse-checkout-cone-mode: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore WeaponPaints.csproj
      - name: Build
        run: dotnet build WeaponPaints.csproj --no-restore -c Release -o build/WeaponPaints
      - name: Pet lifecycle regression checks
        run: dotnet run --project tests/PetStateTests/PetStateTests.csproj -c Release
      - name: Optimization regression checks
        run: dotnet run --project tests/OptimizationTests/OptimizationTests.csproj -c Release
      - name: MySQL integration checks
        env:
          WP_TEST_CONNECTION: "Server=127.0.0.1;Port=3306;User ID=root;Password=;Pooling=true;Allow User Variables=true"
        run: dotnet run --project tests/MySqlIntegration/MySqlIntegration.csproj -c Release
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          plugin=release/addons/counterstrikesharp/plugins/WeaponPaints
          mkdir -p "$plugin" release/addons/counterstrikesharp/gamedata artifacts
          cp -R build/WeaponPaints/. "$plugin/"
          rm -f "$plugin/CounterStrikeSharp.API.dll" \
            "$plugin/McMaster.NETCore.Plugins.dll" \
            "$plugin/Microsoft.DotNet.PlatformAbstractions.dll" \
            "$plugin/Microsoft.Extensions.DependencyModel.dll"
          cp -R website/data "$plugin/"
          cp gamedata/weaponpaints.json release/addons/counterstrikesharp/gamedata/
          (cd release && zip -qr ../artifacts/WeaponPaints.zip addons)
          zip -qr artifacts/WeaponPaints-Website.zip website -x 'website/img/*'
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: WeaponPaints-${{ github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: WeaponPaints-${{ github.sha }}
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip \
            --target "$COMMIT_SHA" \
            --title "Build ${{ github.run_number }}" \
            --notes "Extract WeaponPaints.zip into game/csgo/. Requires CounterStrikeSharp with the .NET 10 runtime. Website images are distributed separately."
