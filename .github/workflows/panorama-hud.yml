name: Panorama mockup
on:
  push:
    paths: ['hud-mockup/**', '.github/workflows/panorama-hud.yml']
  pull_request:
    paths: ['hud-mockup/**', '.github/workflows/panorama-hud.yml']
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python hud-mockup/tools/check.py
