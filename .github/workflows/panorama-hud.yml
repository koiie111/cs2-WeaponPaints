name: Panorama mockup
on:
  push:
    paths: ['hud-mockup/**', '.github/workflows/panorama-hud.yml']
  pull_request:
    paths: ['hud-mockup/**', '.github/workflows/panorama-hud.yml']
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python hud-mockup/tools/check.py
      - run: python hud-mockup/tools/generate_collections.py
      - run: git diff --exit-code -- hud-mockup/live-addon-v12 hud-mockup/catalog/hud-live-contract-v12.json
      - run: python hud-mockup/tools/check_live_contract.py hud-mockup/live-addon-v12
